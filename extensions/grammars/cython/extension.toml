id = "tenmoku.grammar_cython"
name = "Cython syntax"
version = "1.2.0"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "cython"
wasm = "tree-sitter-cython.wasm"
extensions = ["pyx", "pxd", "pxi"]
highlights = "highlights.scm"
injections = "injections.scm"
earlier_patterns_win = false
line_comment = "#"
