id = "tenmoku.grammar_commonlisp"
name = "Common Lisp syntax"
version = "0.4.1"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "commonlisp"
wasm = "tree-sitter-commonlisp.wasm"
extensions = ["lisp", "lsp", "cl", "asd", "asdf", "ros"]
line_comment = ";"
block_comment = ["#|", "|#"]
shebangs = ["sbcl", "ros"]
highlights = "highlights.scm"
injections = "injections.scm"
earlier_patterns_win = false
