# Where this extension's WebAssembly grammar comes from: a commit of the
# grammar's repository, whose tree has the generated parser.c, which
# scripts/build-grammar-wasm.sh fetches and compiles.
#
# rydesun/tree-sitter-dot, Graphviz's DOT language (MIT). Its parser.c is
# ABI 13, and it has no scanner. It reads one graph a file: a second top-level
# `graph` or `digraph` is a syntax error to it, so test/ holds a sample of
# each.
git = "https://github.com/rydesun/tree-sitter-dot"
# The full 40-hex commit: main's newest, 2025-10-21.
rev = "80327abbba6f47530edeb0df9f11bd5d5c93c14d"
# The directory holding parser.c.
src = "src"
# The export tree_sitter_<grammar>, which fixes the file name
# tree-sitter-<grammar>.wasm (with - for _).
grammar = "dot"
