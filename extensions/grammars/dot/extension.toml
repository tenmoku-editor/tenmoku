id = "tenmoku.grammar_dot"
name = "Graphviz DOT syntax"
version = "0.1.6"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "dot"
wasm = "tree-sitter-dot.wasm"
extensions = ["dot", "gv"]
highlights = "highlights.scm"
injections = "injections.scm"
earlier_patterns_win = true
license = "MIT"
line_comment = "//"
block_comment = ["/*", "*/"]
