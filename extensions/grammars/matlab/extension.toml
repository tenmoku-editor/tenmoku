id = "tenmoku.grammar_matlab"
name = "MATLAB syntax"
version = "1.3.4"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "matlab"
wasm = "tree-sitter-matlab.wasm"
extensions = ["m"]
highlights = "highlights.scm"
injections = "injections.scm"
earlier_patterns_win = false
line_comment = "%"
block_comment = ["%{", "%}"]
