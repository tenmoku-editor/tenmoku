id = "tenmoku.grammar_asm"
name = "Assembly syntax"
version = "0.1.0"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "asm"
wasm = "tree-sitter-asm.wasm"
extensions = ["asm", "s", "nasm", "masm"]
highlights = "highlights.scm"
injections = "injections.scm"
earlier_patterns_win = true
license = "MIT"
line_comment = ";"
block_comment = ["/*", "*/"]
