# The built-in markdown grammar as WebAssembly, for crates/fe-syntax/benches/wasm.rs:
# the crate source Cargo.lock pins, which fe-syntax links natively.
# scripts/build-grammar-wasm.sh checks the version against Cargo.lock.
crate = "tree-sitter-md"
version = "0.5.3"
grammar = "markdown"
src = "tree-sitter-markdown/src"
