# The built-in python grammar as WebAssembly, for crates/fe-syntax/benches/wasm.rs:
# the crate source Cargo.lock pins, which fe-syntax links natively.
# scripts/build-grammar-wasm.sh checks the version against Cargo.lock.
crate = "tree-sitter-python"
version = "0.25.0"
grammar = "python"
src = "src"
