# The built-in typescript grammar as WebAssembly, for crates/fe-syntax/benches/wasm.rs:
# the crate source Cargo.lock pins, which fe-syntax links natively.
# scripts/build-grammar-wasm.sh checks the version against Cargo.lock.
crate = "tree-sitter-typescript"
version = "0.23.2"
grammar = "typescript"
src = "typescript/src"
